//file:noinspection GroovyAssignabilityCheck -> ignore
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

/*
 * Die Anbindungen an fremde Mods werden gegen deren Klassen uebersetzt, nicht ueber
 * Reflexion angesprochen. Die JARs dafuer werden hier gesucht; findet sich eine nicht,
 * faellt das zugehoerige Paket aus dem Quelltextsatz. Der Kern kennt die fremden Klassen
 * nicht -- CrossModLoader laedt jede Bruecke ueber ihren Namen --, der Rest der Mod
 * uebersetzt und laeuft also auch ohne sie. Zur Laufzeit ist eine Bruecke nur aktiv,
 * wenn die fremde Mod geladen ist.
 *
 * Gesucht wird in dieser Reihenfolge:
 *   1. -P<name>_jar=/pfad/zur/datei.jar
 *   2. libs/<vorsatz>*.jar        (haendisch abgelegt oder von CI geholt)
 *   3. die angegebenen Nachbarverzeichnisse
 *
 * Die Suche geht ueber den Vorsatz des Dateinamens, nicht ueber "irgendeine JAR" --
 * in libs/ liegen inzwischen mehrere, und jede gehoert zu einer anderen Mod.
 */
def jarsIn(String dir) {
    File folder = file(dir)
    if(!folder.isDirectory()) return new File[0]
    return folder.listFiles({ File f -> f.name.endsWith('.jar') && !f.name.endsWith('-sources.jar') } as FileFilter) ?: new File[0]
}

def resolveJar(String property, String pattern, List<String> dirs) {
    if(project.hasProperty(property)) {
        File explicit = file(project.property(property))
        if(!explicit.isFile()) throw new GradleException("${property} zeigt auf keine Datei: ${explicit}")
        return explicit
    }
    for(String dir : dirs) {
        File found = jarsIn(dir).find { it.name ==~ pattern }
        if(found != null) return found
    }
    return null
}

ext.hbmJar = resolveJar('hbm_jar', "(?i)${hbm_mod_id}.*\\.jar", ['libs', 'hbm/build/libs'])
ext.mekanismJar = resolveJar('mekanism_jar', '(?i)mekanism-(?!generators).*\\.jar', ['libs'])
ext.mekanismGeneratorsJar = resolveJar('mekanism_generators_jar', '(?i)mekanismgenerators.*\\.jar', ['libs'])

if(ext.hbmJar == null) {
    logger.lifecycle("Energy Control: keine HBM-JAR gefunden, die Anbindung crossmod/hbm wird nicht uebersetzt.")
    sourceSets.main.java.exclude 'com/zuxelus/energycontrol/crossmod/hbm/**'
} else {
    logger.lifecycle("Energy Control: HBM-Anbindung wird gegen ${ext.hbmJar} uebersetzt.")
}

/*
 * Mekanism und seine Generatoren sind zwei Mods, die Anbindung ist aber eine. Sie braucht
 * beide JARs zum Uebersetzen; im Spiel genuegt Mekanism selbst -- alles, was die
 * Generatoren betrifft, steht in MekGenerators und wird nur angesprochen, wenn die Mod
 * geladen ist.
 */
if(ext.mekanismJar == null || ext.mekanismGeneratorsJar == null) {
    logger.lifecycle("Energy Control: keine vollstaendigen Mekanism-JARs gefunden, die Anbindung crossmod/mekanism wird nicht uebersetzt.")
    sourceSets.main.java.exclude 'com/zuxelus/energycontrol/crossmod/mekanism/**'
} else {
    logger.lifecycle("Energy Control: Mekanism-Anbindung wird gegen ${ext.mekanismJar} und ${ext.mekanismGeneratorsJar} uebersetzt.")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            // Eigenes Spielverzeichnis, damit CI weiss, wohin eula.txt gehoert, und damit
            // die erzeugte Welt nicht neben den Daten des Clients liegt.
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Der Server liest Befehle von der Standardeingabe. Ohne diese Zeile bekommt er einen
// leeren Strom, und "stop" von aussen erreicht ihn nie.
tasks.withType(JavaExec).matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

// Vom Datengenerator erzeugte Dateien gehoeren in die JAR; .cache enthaelt nur
// Pruefsummen des Erzeugers.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
}

dependencies {
    if(project.ext.hbmJar != null) {
        compileOnly files(project.ext.hbmJar)
    }
    if(project.ext.mekanismJar != null && project.ext.mekanismGeneratorsJar != null) {
        compileOnly files(project.ext.mekanismJar, project.ext.mekanismGeneratorsJar)
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            mod_description         : mod_description,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            hbm_mod_id              : hbm_mod_id,
            mekanism_mod_id         : mekanism_mod_id,
            mekanism_generators_mod_id : mekanism_generators_mod_id,
    ]

    duplicatesStrategy = DuplicatesStrategy.WARN

    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
