name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check asset references
        run: |
          chmod +x ./tools/asset-check.sh
          ./tools/asset-check.sh

      - name: Check project-internal inheritance
        run: |
          chmod +x ./tools/override-check.sh
          ./tools/override-check.sh

      - name: Check project-internal imports
        run: |
          chmod +x ./tools/import-check.sh
          ./tools/import-check.sh

      - name: Check fluid traits
        run: |
          chmod +x ./tools/trait-check.sh
          ./tools/trait-check.sh

      - name: Check resource location names
        run: |
          chmod +x ./tools/location-check.sh
          ./tools/location-check.sh

      - name: Check model textures
        run: |
          chmod +x ./tools/model-check.sh
          ./tools/model-check.sh

      - name: Check block state definitions
        run: |
          chmod +x ./tools/state-check.sh
          ./tools/state-check.sh

      - name: Check translation keys
        run: |
          chmod +x ./tools/lang-check.sh
          ./tools/lang-check.sh

      - name: Check block loot tables
        run: |
          chmod +x ./tools/loot-check.sh
          ./tools/loot-check.sh

      - name: Check data generator wiring
        run: |
          chmod +x ./tools/datagen-check.sh
          ./tools/datagen-check.sh

      - name: Check client/server separation
        run: |
          chmod +x ./tools/dist-check.sh
          ./tools/dist-check.sh

      - name: Check render bounding boxes
        run: |
          chmod +x ./tools/renderbox-check.sh
          ./tools/renderbox-check.sh

      - name: Check creative tabs
        run: |
          chmod +x ./tools/tab-check.sh
          ./tools/tab-check.sh

      - name: Check item renderers
        run: |
          chmod +x ./tools/bewlr-check.sh
          ./tools/bewlr-check.sh

      - name: Check off-screen rendering
        run: |
          chmod +x ./tools/offscreen-check.sh
          ./tools/offscreen-check.sh

      - name: Check renderer facing
        run: |
          chmod +x ./tools/facing-check.sh
          ./tools/facing-check.sh

      # Die Datengenerierung laeuft VOR dem Bau, und zwar aus zwei Gruenden:
      #
      # 1. Sie ist der beste Ersatz fuer einen Client-Start, den CI leisten kann. Sie faehrt den
      #    Mod-Konstruktor hoch und feuert saemtliche Registrierungen -- genau die Phase, in der
      #    die drei Startabstuerze lagen (FT_Toxin, alarm.airRaid, pwr_fuel). Ein Bildschirm
      #    wird dafuer nicht gebraucht.
      # 2. Ohne sie ist die .jar unvollstaendig: src/generated/resources liegt nicht im Baum,
      #    wird aber von sourceSets.main.resources eingezogen. Ohne diesen Schritt fehlen die
      #    Blockzustaende von 493 der 498 Bloecke, saemtliche erzeugten Modelle, die Sprachdatei
      #    und die Beutetabellen.
      - name: Run data generation (also exercises mod construction and all registries)
        run: ./gradlew runData

      # src/main/resources und src/generated/resources sind beide Quellen desselben
      # Ressourcenpfads. Liegt eine Datei in beiden, gewinnt beim Packen eine von ihnen, und
      # welche, laesst sich nicht steuern. Hier wird das gemessen, statt geraten: der Vergleich
      # braucht die erzeugten Dateien und steht deshalb hinter runData, nicht bei den Toren.
      - name: Check for duplicate resource paths
        run: |
          comm -12 \
            <(cd src/main/resources && find . -type f | sort) \
            <(cd src/generated/resources && find . -type f | sort) > doppelte-pfade.txt
          if [ -s doppelte-pfade.txt ]; then
            echo "Diese Dateien liegen handgeschrieben UND erzeugt vor:"
            cat doppelte-pfade.txt
            echo
            echo "Die handgeschriebene Fassung gehoert geloescht, sofern der Erzeuger sie"
            echo "vollstaendig abdeckt -- sonst muss der Erzeuger sie abbilden."
            exit 1
          fi
          echo "OK - keine Datei liegt doppelt vor."

      # Ob jedes Modell auch wirklich entsteht, steht nicht im Quelltext, sondern haengt daran,
      # was der Erzeuger TUT -- kein Tor auf dem Quelltext kann das sehen. Diese Pruefung sieht
      # das Ergebnis und steht deshalb hier, hinter runData. Die Selbstprobe davor stellt
      # sicher, dass sie ueberhaupt noch anschlaegt.
      - name: Check generated models resolve
        run: |
          bash tools/model-resolve-check.sh --selbstprobe
          bash tools/model-resolve-check.sh

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hbmsntm
          path: build/libs/*.jar

      # Der Server ist die naechste Stufe nach der Datengenerierung: er laedt die erzeugten
      # Daten wirklich, baut eine Welt und tickt sie. Damit faellt auf, was beim Schreiben der
      # Dateien noch niemanden gestoert hat -- ein Rezept, das sich nicht lesen laesst, ein
      # Tag auf einen Gegenstand, den es nicht gibt, ein Vorkommen ohne Merkmal.
      #
      # Beendet wird er ueber seine eigene Standardeingabe ("stop"), mit einem harten Abbruch
      # nach Zeitablauf als Rueckfalloption. Geurteilt wird ueber das PROTOKOLL, nicht ueber
      # den Rueckgabewert: bei einem Abbruch nach Zeitablauf ist der ohnehin von aussen gesetzt.
      - name: Run dedicated server (world load smoke test)
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          {
            echo "max-tick-time=-1"
            echo "level-name=ci-world"
            echo "online-mode=false"
            echo "sync-chunk-writes=false"
          } > run/server/server.properties

          ( sleep 240; echo stop; sleep 120 ) | timeout 1200 ./gradlew runServer --console=plain > server.log 2>&1 || true

          echo "----- letzte 80 Zeilen -----"
          tail -80 server.log

          if ! grep -q 'Done (' server.log; then
            echo
            echo "FEHLER: Der Server hat die Welt nie fertig geladen ('Done (' fehlt im Protokoll)."
            echo "Die ersten Ausnahmen:"
            grep -n -m 5 -A 12 'Exception\|Caused by:' server.log || true
            exit 1
          fi

          if grep -q 'Stopping the server' server.log; then
            echo "OK - Welt geladen, Server sauber beendet."
          else
            echo "OK - Welt geladen. (Kein sauberes Herunterfahren im Protokoll -- der harte"
            echo "     Abbruch nach Zeitablauf hat gegriffen.)"
          fi

          # Nicht toedlich, aber wissenswert: woran der Mod sich waehrend des Laufs gestoert hat.
          # Das faellt sonst niemandem auf, weil der Schritt gruen ist.
          FEHLER=$(grep -c '/ERROR\]' server.log || true)
          echo "Fehlerzeilen im Protokoll: $FEHLER"
          if [ "$FEHLER" -gt 0 ]; then
            echo "Die ersten zehn:"
            grep -m 10 '/ERROR\]' server.log | cut -c1-200
          fi

      # Das Protokoll laeuft mit logLevel DEBUG und wird schnell hunderte Megabyte gross --
      # hochgeladen wird deshalb nur das Ende, und alles, was nach einem Fehler aussieht.
      - name: Upload server log
        if: always()
        run: |
          if [ -f server.log ]; then
            tail -n 5000 server.log > server-tail.log
            grep -n -B 2 -A 30 'Exception\|Caused by:\|ERROR\]' server.log | head -n 4000 > server-errors.log || true
          fi
        continue-on-error: true

      - name: Upload server log tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            server-tail.log
            server-errors.log
          if-no-files-found: ignore
